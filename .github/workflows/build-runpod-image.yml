name: RunPod CUDA13 ComfyUI 0.42.1 validation

on:
  pull_request:
    branches: [main]
    paths:
      - "docker/runpod/**"
      - ".github/workflows/build-runpod-image.yml"
      - "RUNPOD_CUSTOMIZATION.md"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Static source and exact upstream startup checks
        run: |
          python3 docker/runpod/validate_sources.py
          python3 docker/runpod/validate_base_start.py
      - name: Free hosted-runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h
      - uses: docker/setup-buildx-action@v3
      - name: Build image locally (never publish)
        uses: docker/build-push-action@v6
        with:
          context: docker/runpod
          load: true
          push: false
          tags: comfyui-mcp-runpod:comfy042-cu130-test
      - name: Docker artifact and workspace persistence checks
        run: bash docker/runpod/test_image.sh comfyui-mcp-runpod:comfy042-cu130-test
